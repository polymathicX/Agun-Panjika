name: Publish app and refresh NASA observations

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh the three public worldwide FIRMS feeds
        type: boolean
        default: false
      full_science:
        description: Rebuild Bangladesh history/weather/outlooks (requires FIRMS_MAP_KEY)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || inputs.refresh_data || inputs.full_science
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scientific pipeline
        if: github.event_name == 'schedule' || inputs.refresh_data || inputs.full_science
        run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        if: inputs.full_science
        with:
          path: |
            data/raw
            data/boundaries
          key: science-${{ github.run_id }}
          restore-keys: science-
      - name: Rebuild Bangladesh scientific products
        if: inputs.full_science
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          test -n "$FIRMS_MAP_KEY" || { echo "FIRMS_MAP_KEY required for a complete requested refresh"; exit 1; }
          python -m pipeline.run_all --api-since 2025-01-01 --neighbours
      - name: Refresh worldwide observations
        if: github.event_name == 'schedule' || inputs.refresh_data || inputs.full_science
        run: python -m pipeline.world_snapshot
      - name: Scientific checks
        if: github.event_name == 'schedule' || inputs.refresh_data || inputs.full_science
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check and build the published snapshot
        working-directory: web
        run: |
          npm ci
          npm run test:evidence
          npm run typecheck
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
